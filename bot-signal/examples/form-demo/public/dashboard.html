<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Submissions dashboard — bot-signal demo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell wide">
      <nav class="topbar">
        <span class="brand">bot-signal <span class="muted">submissions dashboard</span></span>
        <span>
          <a class="link" href="./index.html">← Form</a>
          <button id="reset" class="ghost">Clear</button>
        </span>
      </nav>

      <section class="stats">
        <div class="stat"><span id="stat-total">0</span><small>submissions</small></div>
        <div class="stat ok"><span id="stat-humans">0</span><small>human</small></div>
        <div class="stat bad"><span id="stat-agents">0</span><small>agent / bot</small></div>
      </section>

      <section class="card">
        <table id="table">
          <thead>
            <tr>
              <th>Time</th>
              <th>Verdict</th>
              <th>Score</th>
              <th>Who filled it</th>
              <th>IP / UA</th>
              <th>Layers</th>
              <th>Top signals</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="7" class="muted">No submissions yet — fill the form.</td></tr>
          </tbody>
        </table>
      </section>
    </main>

    <script src="./dashboard.js"></script>
  </body>
</html>
