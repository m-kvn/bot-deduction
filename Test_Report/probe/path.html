<!doctype html><html><head><title>BSPATH-WINDOW</title></head>
<body style="margin:0;height:100vh;background:#0d1117;color:#e6edf3;font:16px system-ui">
<div style="padding:24px">
  <h2 id="mode">ready</h2>
  <pre id="out">points: 0</pre>
</div>
<script>
window.__p = [];
addEventListener('pointermove', function (e) {
  if (e.pointerType !== 'mouse') return;
  window.__p.push([Math.round(e.clientX * 100) / 100, Math.round(e.clientY * 100) / 100, Math.round(e.timeStamp * 10) / 10]);
  document.documentElement.dataset.path = window.__p.map(function (p) { return p.join(','); }).join(';');
  document.getElementById('out').textContent = 'points: ' + window.__p.length;
}, true);
</script></body></html>
